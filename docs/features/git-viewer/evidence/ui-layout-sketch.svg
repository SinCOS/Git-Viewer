<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" font-family="-apple-system, 'Helvetica Neue', sans-serif">
  <defs>
    <style>
      .muted{fill:#8a8f98;font-size:12px}
      .label{fill:#1f2328;font-size:13px}
      .bold{font-weight:600}
      .small{font-size:11px}
      .mono{font-family:'SF Mono', Menlo, monospace;font-size:12px}
      .panel{fill:#ffffff;stroke:#d1d5da;rx:6}
      .inset{fill:#f6f8fa;stroke:#e1e4e8}
    </style>
  </defs>

  <!-- window -->
  <rect x="10" y="10" width="1260" height="800" rx="10" fill="#ffffff" stroke="#c9cdd2"/>
  <rect x="10" y="10" width="1260" height="34" rx="10" fill="#f0f2f4" stroke="#c9cdd2"/>
  <circle cx="30" cy="27" r="6" fill="#ff5f57"/><circle cx="48" cy="27" r="6" fill="#febc2e"/><circle cx="66" cy="27" r="6" fill="#28c840"/>
  <text x="640" y="32" text-anchor="middle" class="label muted">Git Viewer</text>

  <!-- top bar -->
  <line x1="10" y1="44" x2="1270" y2="44" stroke="#d1d5da"/>
  <text x="30" y="72" class="label bold">Workspace: dev.code-workspace ▾</text>
  <text x="300" y="72" class="label bold">Repository: huacaijia_api ▾</text>
  <text x="540" y="72" class="label bold">⎇ master ▾</text>
  <text x="1210" y="72" class="label">⟳</text>
  <text x="1240" y="72" class="label">⚙</text>
  <line x1="10" y1="88" x2="1270" y2="88" stroke="#d1d5da"/>

  <!-- left rail -->
  <rect x="10" y="88" width="76" height="688" fill="#f6f8fa" stroke="#d1d5da"/>
  <!-- Commit item (selected) -->
  <rect x="14" y="100" width="68" height="64" rx="6" fill="#e7f0ff"/>
  <circle cx="48" cy="124" r="9" fill="none" stroke="#2f6feb" stroke-width="2"/>
  <path d="M44 124h8M48 120v8" stroke="#2f6feb" stroke-width="2"/>
  <text x="48" y="152" text-anchor="middle" class="small bold" fill="#2f6feb">Commit</text>
  <!-- Git Log -->
  <circle cx="48" cy="200" r="9" fill="none" stroke="#57606a" stroke-width="2"/>
  <circle cx="48" cy="194" r="2.5" fill="#57606a"/><circle cx="48" cy="206" r="2.5" fill="#57606a"/>
  <path d="M48 196v8" stroke="#57606a" stroke-width="2"/>
  <text x="48" y="228" text-anchor="middle" class="small muted">Git Log</text>
  <!-- Worktree -->
  <rect x="40" y="278" width="16" height="12" rx="2" fill="none" stroke="#57606a" stroke-width="2"/>
  <text x="48" y="308" text-anchor="middle" class="small muted">Worktree</text>
  <text x="48" y="760" text-anchor="middle" class="small muted">⌘1⌘2⌘3</text>

  <!-- main area: Commit mode -->
  <!-- Local Changes panel -->
  <rect x="94" y="96" width="330" height="610" class="panel"/>
  <text x="110" y="122" class="label bold">Local Changes</text>
  <text x="150" y="158" class="label muted">▼ Changes (3)</text>
  <g class="mono">
    <rect x="116" y="172" width="13" height="13" rx="3" fill="#2f6feb"/><path d="M119 178l3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="140" y="184" class="mono">M  internal/git/status.go</text>
    <rect x="116" y="196" width="13" height="13" rx="3" fill="#2f6feb"/><path d="M119 202l3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="140" y="208" class="mono">M  ui/window.go</text>
    <rect x="116" y="220" width="13" height="13" rx="3" fill="none" stroke="#c9cdd2"/>
    <text x="140" y="232" class="mono" fill="#8a8f98">A  README.md</text>
  </g>
  <text x="110" y="264" class="label muted">☐ 勾选 = Stage · 取消 = Unstage</text>
  <text x="110" y="286" class="label muted">点击行 = Diff Preview</text>

  <!-- Diff preview panel -->
  <rect x="432" y="96" width="560" height="430" class="panel"/>
  <text x="448" y="122" class="label bold">Diff Preview</text>
  <text x="560" y="122" class="mono muted">internal/git/status.go · Staged</text>
  <rect x="448" y="136" width="528" height="24" class="inset"/>
  <text x="458" y="153" class="mono muted">[Copy diff]  [🔍 Find  ⌘F]</text>
  <g class="mono">
    <rect x="448" y="176" width="528" height="26" fill="#ffebe9"/><text x="458" y="194">-25    return parseLegacy(data)</text>
    <rect x="448" y="202" width="528" height="26" fill="#dafbe1"/><text x="458" y="220">+25    return parsePorcelain(data)</text>
    <text x="458" y="246"> 26  }</text>
    <text x="458" y="272"> 27</text>
    <rect x="448" y="286" width="528" height="26" fill="#ffebe9"/><text x="458" y="304">-28    if legacy { … }</text>
    <rect x="448" y="312" width="528" height="26" fill="#dafbe1"/><text x="458" y="330">+28    if porcelain { … }</text>
  </g>
  <text x="448" y="500" class="small muted">单栏 diff · 虚拟列表 · >512 KiB 降级提示</text>

  <!-- Commit message / operation panel -->
  <rect x="432" y="534" width="560" height="172" class="panel"/>
  <text x="448" y="560" class="label bold">Commit Message</text>
  <rect x="448" y="572" width="528" height="70" class="inset"/>
  <text x="460" y="594" class="mono">Fix Git status parsing</text>
  <rect x="700" y="656" width="110" height="30" rx="6" fill="#2f6feb"/>
  <text x="755" y="676" text-anchor="middle" class="label bold" fill="#ffffff">Commit</text>
  <rect x="818" y="656" width="158" height="30" rx="6" fill="#e7f0ff" stroke="#2f6feb"/>
  <text x="897" y="676" text-anchor="middle" class="label bold" fill="#2f6feb">Commit and Push ▾</text>
  <text x="448" y="676" class="small muted">⌘⏎ 提交 · 失败不静默 · hook 错误回显</text>

  <!-- right column: worktree/branches context -->
  <rect x="1000" y="96" width="256" height="610" class="panel"/>
  <text x="1016" y="122" class="label bold">Worktree / Branches</text>
  <text x="1016" y="150" class="label muted">WORKTREES</text>
  <text x="1030" y="174" class="label">master · ~/code/api</text>
  <text x="1030" y="196" class="label">feature/delivery · locked</text>
  <text x="1016" y="228" class="label muted">BRANCHES</text>
  <text x="1030" y="252" class="label">● master   ↑0 ↓0</text>
  <text x="1030" y="274" class="label">● develop</text>
  <text x="1016" y="306" class="label muted">OPERATIONS</text>
  <text x="1030" y="330" class="label">[Stage] [Unstage]</text>
  <text x="1030" y="352" class="label">[Fetch] [Pull --ff-only]</text>
  <text x="1030" y="374" class="label">[Push]  [Switch branch]</text>

  <!-- status bar -->
  <rect x="10" y="776" width="1260" height="34" fill="#f0f2f4" stroke="#d1d5da"/>
  <text x="30" y="798" class="label muted">⎇ master · 3 changes</text>
  <text x="1120" y="798" class="label muted">Local · SSH Connected</text>
  <text x="940" y="798" class="label muted">⟳ 15s 轮询 / 监听</text>

  <!-- annotations -->
  <g font-size="11" fill="#b08800">
    <text x="16" y="860"></text>
  </g>
  <text x="94" y="726" class="small" fill="#b08800">② Operations Toolbar（SSH/路径/模式快捷）</text>
</svg>
